name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, tests, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install (the core requirements plus test and lint tools)
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check pipeline tests scripts

      - name: Format check
        run: ruff format --check pipeline tests scripts

      - name: Tests with coverage
        run: python -m pytest -q --cov --cov-report=term --cov-report=xml

      - name: Keep the coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  package:
    name: Package (pip install . then run it)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the package into a clean environment
        run: pip install .

      - name: The command and the modules work from outside the repository
        working-directory: ${{ runner.temp }}
        run: |
          bfsi-curate --version
          python -c "import pipeline, pipeline.api, pipeline.server, pipeline.cli; print('imports ok', pipeline.__version__)"

  docker:
    name: Docker (build the image, curate a PDF inside it)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t bfsi-curate:ci .

      - name: The command runs
        run: docker run --rm bfsi-curate:ci --version

      - name: Curate a real PDF in the container, as an ordinary user, with mounted folders
        run: |
          mkdir -p "$RUNNER_TEMP/in" "$RUNNER_TEMP/out"
          cp data/raw/fiu_india_brochure.pdf "$RUNNER_TEMP/in/"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$RUNNER_TEMP/in:/in:ro" -v "$RUNNER_TEMP/out:/out" \
            bfsi-curate:ci run /in -o /out
          test "$(wc -l < "$RUNNER_TEMP/out/curated.jsonl")" -eq 10
          test -s "$RUNNER_TEMP/out/pipeline_summary.json"

  dashboard:
    name: Dashboard (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
